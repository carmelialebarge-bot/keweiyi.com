<block name="hometitle">友情链接</block>
<block name="contents">
			<div class="row-fluid">
			<div class="span12">
			<div class="widget-box">
							<div class="widget-title">

								<span class="icon">
									<i class="icon-th"></i>
								</span>

								<h5>修改友情链接</h5><h5><a href="<{:U('Link/index')}>">返回链接列表</a></h5>
							</div>
							<div id="top-alert" class="fixed alert alert-error" style="display: none;position: fixed !important;">
								<button class="close fixed" style="margin-top: 4px;position: fixed !important;">&times;</button>
								<div class="alert-content">这是内容</div>
							</div>
							<div class="widget-content nopadding">
								<form class="form-horizontal" id="myform" action="<{:U('uplink')}>" method="post">
								<DIV class="PageContent">
								<table width="98%" border="0" style="margin:20px;" class="ListCategory">
								  <tr>
									<td width="14%">链接名称：</td>
									<td width="86%" height="35"><input name="name" type="text" value="<{$links.name}>" class="FormSmall" style="width: 220px;"> <span style="color:#F00; font-size:12px;">*必填</span>
									</td>
								  </tr>
								  <tr>
									<td width="14%">链接名称(英文)：</td>
									<td width="86%" height="35"><input name="ename" type="text" value="<{$links.ename}>" class="FormSmall" style="width: 220px;"> <span style="color:#F00; font-size:12px;">*必填</span>
									</td>
								  </tr>

								  <tr>
									<td>排序ID：</td>
									<td height="35"><input name="sort" type="text" value="<{$links.sort}>" class="FormSmall" style="width: 50px;"> <span style="color:#F00; font-size:12px;">*必填</span></td>
								  </tr>
								  
								  <tr>
									<td>链接地址：</td>
									<td height="35"><input name="url" type="text" value="<{$links.url}>" class="FormSmall" style="width: 320px;"><a title='需以http://开头'style="margin-left: 5px;" href="#"><img src="__IMG__/help.gif"></a></td>
								  </tr>
								  <tr>
									<td>链接地址(英文)：</td>
									<td height="35"><input name="eurl" type="text" value="<{$links.eurl}>" class="FormSmall" style="width: 320px;"><a title='需以http://开头'style="margin-left: 5px;" href="#"><img src="__IMG__/help.gif"></a></td>
								  </tr>
								  
								  
								  <tr>
									<td height="55" align="center">
									</td>
									<td height="55" align="left">
									<input type="hidden" name="id" value="<{$links.id}>">
									<button type="submit"  class="btn submit-btn ajax-post" target-form="form-horizontal">确认修改</button>
									</td>
									</tr>
								</table>
								</DIV>
								</form>
 
 
							</div>
						</div>
				</div>
			</div>
			
			
				 </block>
