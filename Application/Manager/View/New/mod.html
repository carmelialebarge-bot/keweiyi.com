<block name="hometitle">内容管理</block>
<block name="contents">

<ul class="nav nav-tabs">
  <li class="active"><a href="#tab0" data-toggle="tab">中文信息</a></li>
  <li><a href="#tab1" data-toggle="tab">英文信息</a></li>
 </ul>
  <div class="tab-content">
 <div class="tab-pane active" id="tab0">
			<div class="row-fluid">
			<div class="span12">
			<div class="widget-box">
							<div class="widget-title">

								<span class="icon">
									<i class="icon-th"></i>
								</span>

								<h5>修改新闻</h5><h5><a href="<{:U('New/index')}>">返回新闻列表</a></h5>
							</div>
							
							<div class="widget-content nopadding">
							<form action="<{:U('updatenew')}>" method="post" id="myform" class="form-horizontal">
<DIV class="PageContent">
<table width="98%" border="0" style="margin:20px;" class="ListCategory">
  <tr>
    <td width="9%">新闻标题：</td>
    <td width="91%" height="35"><input name="title" type="text" value="<{$news.title}>"  style="width: 320px;"> 
	<span style="color:#F00; font-size:12px;">*必填</span>
    </td>
  </tr>
  
  <tr>
    <td>新闻分类:</td>
    <td height="35">
      <select name="pid" style="height:28px;">
      <volist name='list' id='vo'>
          <option value="<{$vo.id}>" <eq name="vo.id" value="$news.pid">selected="selected"</eq>><{$vo.html}><if condition='$vo.level gt 0'>┕</if><{$vo.name}></option>
      </volist>
      </select>
    </td>
  </tr>

  <tr>
    <td>排序ID：</td>
    <td height="35"><input name="sort" type="text" value="<{$news.sort}>"  style="width: 50px;"> <span style="color:#F00; font-size:12px;">*必填</span></td>
  </tr>

  <tr>
    <td>URL优化：</td>
    <td height="35"><input name="url" type="text" value="<{$news.url}>"  style="width: 320px;"> <a title='URL只能是字母，数字，下划线或-'style="margin-left: 5px;" href="#"><img src="__IMG__/help.gif"></a></td>
  </tr>
  
  <tr>
    <td>SEO关键字：</td>
    <td height="35"><input name="keywords" type="text" value="<{$news.keywords}>"   style="width: 320px;"></td>
  </tr>
  
  <tr>
    <td>SEO描述：</td>
    <td height="110"><textarea name="description"  style="width: 450px; height: 80px;"><{$news.description}></textarea>
    </td>
  </tr>
  
  <tr>
    <td>新闻内容：</td>
    <td>
    <textarea name="contents" style="width:680px; height:320px; margin:8px 0;visibility:hidden;"><{$news.contents}></textarea>
    </td>
  </tr>
</table>
</DIV>

 
 
							</div>
						</div>
				</div>
			</div>
		</div>


<div class="tab-pane" id="tab1">
			<div class="row-fluid">
			<div class="span12">
			<div class="widget-box">
							<div class="widget-title">

								<span class="icon">
									<i class="icon-th"></i>
								</span>

								<h5>修改新闻(英文)</h5><h5><a href="<{:U('New/index')}>">返回新闻列表</a></h5>
							</div>
							
							<div class="widget-content nopadding">
							
<div class="PageContent">
<table width="98%" border="0" style="margin:20px;" class="ListCategory">
  <tr>
    <td width="14%">新闻标题(英文)：</td>
    <td width="86%" height="35"><input name="etitle" type="text" value="<{$news.etitle}>"  style="margin-bottom:0;width: 320px;"> 
	<span style="color:#F00; font-size:12px;">*必填</span>
    </td>
  </tr>
   <tr>
    <td>SEO关键字(英文)：</td>
    <td height="35"><input name="ekeywords" type="text" value="<{$news.ekeywords}>"   style="margin-bottom:0;width: 320px;"></td>
  </tr>
  
  <tr>
    <td>SEO描述(英文)：</td>
    <td height="110"><textarea name="edescription"  style="margin-bottom:0;width: 450px; height: 80px;"><{$news.edescription}></textarea>
    </td>
  </tr>
  
  <tr>
    <td>新闻内容(英文)：</td>
    <td>
    <textarea name="econtents" style="width:680px; height:320px; margin:8px 0;visibility:hidden;"><{$news.econtents}></textarea>
    </td>
  </tr>
</table>
</div>

 
 
							</div>
						</div>
				</div>
			</div>
		</div>
	</div>
	<div style="float:left; margin:-10px 0px 20px 450px;">
	<input type="hidden" name="id" value="<{$news.id}>">
    <button type="submit"  class="btn submit-btn ajax-post" target-form="form-horizontal">确认修改</button>
</div>
</form>	

			
				 </block>
