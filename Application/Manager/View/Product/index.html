<extend name="Public/base"/>
<block name="css">
		
		<script type="text/javascript">
	$(function () {
		$( '.del' ).click( function () {
			return confirm('确认删除该产品？');
		} );
	});

  function formSubmit(n) {
    form = document.getElementById("theForm");
    switch(n) {
    case 1:
        form.action="<{:U('uporder')}>";
        break;
    case 2:
        form.action="<{:U('delall')}>";
        break;
     }
     form.submit();
  }

</script>
<script src="__JS__/select.js"></script>

.proimg:hover{background-color:#045ace;}

<block name="hometitle">内容管理</block>
<block name="contents">
			<div class="row-fluid">
			<div class="span12">
			<div class="widget-box">
							<div class="widget-title">

								<span class="icon">
									<i class="icon-th"></i>
								</span>

								<h5>产品管理</h5>
							</div>
							
							<div class="widget-content nopadding">
							<table width="100%" border="0" cellpadding="0" cellspacing="0">
  <tr>
    <td class="LineRightBlue1">
        <table width="95%" border="0" cellpadding="0" cellspacing="0" style="margin-left:20px;margin-top:5px;">
      <tr>
        <td width="54%" height="32">
          <div style="float:left; width:312px; padding-top:6px;"><a href="<{:U('Product/add')}>">添加产品</a>
          &nbsp;&nbsp;&nbsp;&nbsp;<a href="javascript:select()">全选</a> | <a href="javascript:fanselect()">反选</a> | <a href="javascript:noselect()">全不选</a>
          </div>
        <select style="margin-bottom: 0px;" onchange="location.href=this.value;">
          <option value="<{:U('Product/index')}>" selected>按分类索引</option>
          <volist name="list" id="vo">
          <option value="<{:U('Product/search',array('pid'=>$vo['id']))}>" <eq name="vo.id" value="$pid">selected="selected"</eq>><{$vo.html}><if condition='$vo.level gt 0'>┕</if><{$vo.name}></option>
		  </volist>	
        </select >
        
          <td width="33%" height="32">
            <form method="get" action="<{:U('Product/search')}>">
              <div style="float:left;  height:24px;"><input type="text" name="keyword" class="FormSmall" "></div>
              <div style="float:left;"><input type="submit" value="产品搜索" class="bginput" style="width:60px; height:30px; font-size:12px;"/></div>
            </form>
          </td>
        </td>
        <td width="13%" align="right" class="bt_add"></td>
      </tr>
    </table>
    </td>
  </tr>
</table>

<form name="theForm" method="post" id="theForm" action="">
  <div class="tablelisthead">
    <ul pid='0' style="margin-left: 10px;" >
      <li class="li_10" style="width:7.5%">排序</li>
      <li class="li_40" style="width:42%">产品名称</li>
      <li class="li_20">编辑</li>
    </ul>
  </div>
  
  <div id="languageBox2">
    <div class="tablelist">
    <volist name='product' id='vo'>
      <ul onmouseover="this.style.background ='#F1F1F1'" onmouseout="this.style.background ='#FFFFFF'" style="height:55px;">

          <li class="li_10">
          <span style="float:right;"><input class="ids" name="dell[]" type="checkbox" value="<{$vo.id}>"></span>
          <input type="text" value="<{$vo.sort}>" name="sort[<{$vo.id}>]" class="listinput"/>
          </li>

          <li class="li_40">
            <img src="__ROOT__/Uploads/<{$vo.thumb}>" class="proimg"/>
            <span><a href="<{:U('mod',array('id'=>$vo['id']))}>" title="<{$vo.name}>"><{$vo.name|mb_substr=###,0,22,'utf-8'}></a></span>
            <if condition="$vo.featured eq 1"><span style="font-size:12px;color:#999;">[已推荐]</span><else/><span style="font-size:12px;color:#999;">[未推荐]</span></if>
          </li>

          <li class="li_40">
            <a href="<{:U('mod',array('id'=>$vo['id']))}>" style="font:12px/45px;">修改</a> | 
            <a href="<{:U('del',array('id'=>$vo['id']))}>" class="confirm ajax-get">删除</a> |
            <a href="<{:U('copydata',array('id'=>$vo['id']))}>" class="confirm ajax-get" >复制产品</a>
          </li>

      </ul>
    </volist>  
    </div>
  </div>
  
  <table width="100%" border="0" cellspacing="0" cellpadding="0">
    <tr>
      <td height="36" class="BotNavBg">
        <table width="900" border="0" cellspacing="0" cellpadding="0">
          <tr>
            <td width="170" style="padding-left:5px;">
            <input type="button" value="更新排序" onclick="formSubmit(1)" class="btn"/>
            <button url="<{:U('delall')}>" target-form="ids" class="btn ajax-post confirm">删除所选</button>
            </td>
            <td width="730" align="center">
            <div class="page"><{$show}></div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</form>
								
 
 
							</div>
						</div>
				</div>
			</div>
			
			
				 </block>

			 <script src="__JS__/unicorn.js"></script>
