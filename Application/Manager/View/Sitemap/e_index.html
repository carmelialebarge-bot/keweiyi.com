<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Sitemap-<{$Think.config.seo_title}></title>
<meta name="keywords" content="<{$Think.config.seo_keywords}>" />
<meta name="description" content="<{$Think.config.seo_description}>" />
<include file='Public:file'/>
<include file='./Application/Home/View/Public/file.html'/>
<script language="javascript">var catid="",pid="";</script>
<load href="../Public/js/left_active.js"/>
</head>
<body>
<include file='./Application/Home/View/Public/head.html'/>
<div id="main">


    <div id="center">

      <div id="left">
          <div class="category_title"></div>
          <ul class="category" id="left_cat">
             <li><a id="cat_active" href="__ROOT__/sitemap.html">Sitemap</a></li>
          </ul>         
          <include file='Public:contact'/>
      </div>
      <!-- end of left -->
        
        <div id="right">
          <div class="path_title"><a href="__ROOT__/"><img src="./Public/Home/images/home_btn.jpg" class="home_btn" alt="Home"></a>&nbsp; &gt;&nbsp;Sitemap</div>
          
          <ul class="ul_sitemap">
            <li><a href="__ROOT__/" target="_blank">Home</a></li>
            <volist name="list" id="vo">
                 <li <if condition='$vo.level eq 2'>class="small_li2_sitemap"<elseif condition='$vo.level eq 1'/>class="small_li_sitemap"</if>>|-<{$vo.html}>
                    <a href="<{:W('Listhref/Listhref',array('url'=>$vo['url'],'id'=>$vo['id'],'link'=>$vo['link']))}>" target="_blank"><{$vo.ename}></a>  
                 </li>
            </volist>
          </ul>
            
        </div>
        <!-- end of right -->
        
        <div class="clear"></div>
    </div>
    <!-- end of center -->

</div>
<!-- end of main -->

<include file='Public:foot'/>

</body>
</html>
