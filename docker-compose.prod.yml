version: "3.3"

services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: keweiyi_web
    restart: unless-stopped
    ports:
      - "${KEWEIYI_WEB_PORT:-18081}:80"
    volumes:
      - ./:/var/www/html
      - ./config/db.php:/var/www/html/db.php:ro
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/zz-keweiyi-local.ini:ro
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: keweiyi_mysql
    restart: unless-stopped
    command: --character-set-server=utf8 --collation-server=utf8_general_ci --sql-mode=""
    environment:
      MYSQL_ROOT_PASSWORD: ${KEWEIYI_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: keweiyi
      MYSQL_USER: keweiyi
      MYSQL_PASSWORD: ${KEWEIYI_MYSQL_PASSWORD}
    volumes:
      - keweiyi_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ukeweiyi -p\"$${MYSQL_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  keweiyi_mysql_data:
