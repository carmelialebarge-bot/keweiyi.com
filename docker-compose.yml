services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: keweiyi_web
    ports:
      - "18081:80"
    volumes:
      - ./:/var/www/html
      - ./docker/db.docker.php:/var/www/html/db.php:ro
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/zz-keweiyi-local.ini:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:5.7
    container_name: keweiyi_mysql
    command: --character-set-server=utf8 --collation-server=utf8_general_ci --sql-mode=""
    environment:
      MYSQL_ROOT_PASSWORD: keweiyi_root_dev
      MYSQL_DATABASE: keweiyi
      MYSQL_USER: keweiyi
      MYSQL_PASSWORD: keweiyi_dev_password
    ports:
      - "18082:3306"
    volumes:
      - keweiyi_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ukeweiyi", "-pkeweiyi_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  keweiyi_mysql_data:
